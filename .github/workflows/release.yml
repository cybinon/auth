name: Release

on:
  push:
    branches:
      - master
      - release/*

permissions:
  contents: write
  pull-requests: write
  packages: write
  id-token: write

jobs:
  release_please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      MAIN_RELEASE_VERSION: ${{ steps.versions.outputs.MAIN_RELEASE_VERSION }}
      RELEASE_VERSION: ${{ steps.versions.outputs.RELEASE_VERSION }}
      RELEASE_CANDIDATE: ${{ steps.versions.outputs.RELEASE_CANDIDATE }}
      RELEASE_NAME: ${{ steps.versions.outputs.RELEASE_NAME }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: go
          target-branch: ${{ github.ref_name }}

      - name: Check out code
        uses: actions/checkout@v4
        if: ${{ steps.release.outputs.release_created == 'true' || steps.release.outputs.prs_created == 'true' }}
        with:
          fetch-depth: 0

      - name: Set version variables
        id: versions
        if: ${{ steps.release.outputs.release_created == 'true' || steps.release.outputs.prs_created == 'true' }}
        run: |
          set -ex

          # Determine whether this is a candidate or not
          RELEASE_CANDIDATE=false
          if [[ "${{ steps.release.outputs.release_created }}" != "true" ]]; then
            RELEASE_CANDIDATE=true
          fi

          # Parse version info
          if [[ "$RELEASE_CANDIDATE" == "true" ]]; then
            # Extract version from PR title
            PR_TITLE='${{ steps.release.outputs.pr && fromJSON(steps.release.outputs.pr).title }}'
            VERSION=$(echo "$PR_TITLE" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?')
            MAIN_RELEASE_VERSION=$(echo "$VERSION" | sed -E 's/-rc\..*//')
            RELEASE_VERSION="$VERSION"
            RELEASE_NAME="rc$RELEASE_VERSION"
          else
            MAIN_RELEASE_VERSION=${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}.${{ steps.release.outputs.patch }}
            RELEASE_VERSION="$MAIN_RELEASE_VERSION"
            RELEASE_NAME="v$RELEASE_VERSION"
          fi

          echo "MAIN_RELEASE_VERSION=$MAIN_RELEASE_VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_CANDIDATE=$RELEASE_CANDIDATE" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=$RELEASE_NAME" >> "$GITHUB_ENV"

          echo "MAIN_RELEASE_VERSION=$MAIN_RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "RELEASE_CANDIDATE=$RELEASE_CANDIDATE" >> "$GITHUB_OUTPUT"
          echo "RELEASE_NAME=$RELEASE_NAME" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@v5
        if: ${{ steps.release.outputs.release_created == 'true' || steps.release.outputs.prs_created == 'true' }}
        with:
          go-version: "1.23.7"

      - name: Build release artifacts
        if: ${{ steps.release.outputs.release_created == 'true' || steps.release.outputs.prs_created == 'true' }}
        run: |
          set -ex
          make deps
          make all
          cp auth gotrue
          tar -czvf auth-v${RELEASE_VERSION}-x86.tar.gz auth gotrue migrations/
          mv auth-arm64 auth
          tar -czvf auth-v${RELEASE_VERSION}-arm64.tar.gz auth gotrue migrations/

          # Fast update package
          rm gotrue
          mv auth gotrue
          tar -czvf auth-v${RELEASE_VERSION}.supafast-arm64.tar.gz gotrue migrations/

      - name: Generate checksums
        if: ${{ steps.release.outputs.release_created == 'true' || steps.release.outputs.prs_created == 'true' }}
        run: |
          >checksums.txt
          echo "## Checksums" >> checksums.txt

          for file in *.tar.gz; do
            echo "### SHA256" >> checksums.txt
            echo "\`\`\`" >> checksums.txt
            sha256sum "$file" | awk '{print $1}' >> checksums.txt
            echo "\`\`\`" >> checksums.txt
          done

      - name: Upload artifacts and create release
        if: ${{ steps.release.outputs.release_created == 'true' || steps.release.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -ex

          if [[ "$RELEASE_CANDIDATE" == "true" ]]; then
            PR_NUMBER=$(echo '${{ steps.release.outputs.pr }}' | jq -r '.number')

            CHECKSUM_CONTENT=$(cat checksums.txt)

            gh release create "$RELEASE_NAME" \
              --title "v$RELEASE_VERSION" \
              --prerelease \
              -n "This is a release candidate. See release-please PR #$PR_NUMBER for context.\n\n$CHECKSUM_CONTENT"

            gh pr comment "$PR_NUMBER" -b "Release candidate [v$RELEASE_VERSION](https://github.com/supabase/gotrue/releases/tag/$RELEASE_NAME)  published."
          else
            if [[ "$GITHUB_REF" == "refs/heads/main" || "$GITHUB_REF" == "refs/heads/master" ]]; then
              if [[ "$RELEASE_VERSION" =~ \.[0]+$ ]]; then
                gh api \
                  --method POST \
                  -H "Accept: application/vnd.github+json" \
                  /repos/supabase/gotrue/git/refs \
                  -f "ref=refs/heads/release/${RELEASE_VERSION}" \
                  -f "sha=$GITHUB_SHA"
              fi
            fi

            EXISTING_NOTES=$(gh release view "$RELEASE_NAME" --json body -q .body)
            CHECKSUM_CONTENT=$(cat checksums.txt)

            FULL_NOTES="$(printf "%s\n\n%s" "$EXISTING_NOTES" "$CHECKSUM_CONTENT")"

            gh release edit "$RELEASE_NAME" -n "$FULL_NOTES"
            gh release upload "$RELEASE_NAME" ./auth-v${RELEASE_VERSION}-x86.tar.gz ./auth-v${RELEASE_VERSION}-arm64.tar.gz ./auth-v${RELEASE_VERSION}.supafast-arm64.tar.gz
          fi

  publish:
    needs: release_please
    if: ${{ success() && needs.release_please.outputs.RELEASE_VERSION }}
    uses: ./.github/workflows/publish.yml
    secrets: inherit
    with:
      version: ${{ needs.release_please.outputs.RELEASE_VERSION }}